[build-system]
requires = ["setuptools", "numpy>=2", "Cython>=3.2"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 79
target-version = ["py311", "py312", "py313", "py314", "py315"]
skip-string-normalization = true

[tool.isort]
known_first_party = ["liffile"]
profile = "black"
line_length = 79
